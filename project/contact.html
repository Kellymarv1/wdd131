<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>AI Tools Hub | Contact</title>
   <meta name="description" content="Contact AI Tools Hub with your questions, suggestions, or feedback about AI tools.">
   <meta name="author" content="Kehinde Marvellous">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="styles/base.css">
   <link rel="stylesheet" href="styles/large.css">

   <script src="scripts/main.js" defer></script>

</head>

<body>

<header>

   <div class="logo">
       🤖 AI Tools Hub
   </div>

   <button id="menu" aria-label="Open Navigation">
       ☰
   </button>

   <nav>

       <ul class="navigation">

           <li><a href="index.html">Home</a></li>
           <li><a href="tools.html">AI Tools</a></li>
           <li><a href="contact.html" class="active">Contact</a></li>

       </ul>

   </nav>

</header>

<main>

<section class="page-title">

   <h1>Contact Us</h1>

   <p>

       We'd love to hear your suggestions for new AI tools or improvements
       to this website.

   </p>

</section>

<section class="contact-form">

<form id="contactForm">

<div class="form-group">

<label for="fullname">

Full Name

</label>

<input
type="text"
id="fullname"
name="fullname"
required>

</div>

<div class="form-group">

<label for="email">

Email Address

</label>

<input
type="email"
id="email"
name="email"
required>

</div>

<div class="form-group">

<label for="tool">

Favorite AI Tool

</label>

<select id="tool" name="tool">

<option value="">Select One</option>

<option value="ChatGPT">ChatGPT</option>

<option value="Gemini">Gemini</option>

<option value="Claude">Claude</option>

<option value="Copilot">GitHub Copilot</option>

<option value="Midjourney">Midjourney</option>

</select>

</div>

<div class="form-group">

<label for="message">

Message

</label>

<textarea
id="message"
name="message"
rows="6"
required></textarea>

</div>

<input
type="submit"
value="Send Message"
class="button">

</form>

</section>

<section>

<h2>Thank You!</h2>

<p id="thankyou">

Complete the form above and submit your message.

</p>

</section>

</main>

<footer>

<p>

© <span id="year"></span> AI Tools Hub | Kehinde Marvellous | WDD 131

</p>

<p>

<a href="references.html">

References

</a>

</p>

</footer>

</body>
</html>
