<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Share your experience and submit a detailed product review through our form.">
   <meta name="author" content="Kehinde Marvellous">

   <title>Product Review Form</title>

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="styles/form.css">
   <link rel="stylesheet" href="styles/form-large.css">

   <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
   <h1>Product Review Form</h1>
</header>

<main>

<form method="get" action="review.html">

   <!-- Product Name -->
   <div class="form-group">
       <label for="product">Product Name <span>*</span></label>

       <select id="product" name="product" required>
           <option value="" selected disabled>Select a Product ...</option>
           <!-- JavaScript will insert products here -->
       </select>
   </div>

   <!-- Overall Rating -->
   <fieldset>
       <legend>Overall Rating <span>*</span></legend>

       <div class="rating">
            <div>
                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>
            </div>

           <div>
               <input type="radio" id="star2" name="rating" value="2" required>
               <label for="star2">☆☆</label>
           </div>

           <div>
               <input type="radio" id="star3" name="rating" value="3" required>
               <label for="star3">☆☆☆</label>
           </div>

           <div>
               <input type="radio" id="star4" name="rating" value="4" required>
               <label for="star4">☆☆☆☆</label>
           </div>

           <div>
               <input type="radio" id="star5" name="rating" value="5" required>
               <label for="star5">☆☆☆☆☆</label>
           </div>

       </div>
   </fieldset>

   <!-- Installation Date -->
   <div class="form-group">
       <label for="installDate">Date of Installation <span>*</span></label>

       <input
           type="date"
           id="installDate"
           name="installDate"
           required>
   </div>

   <!-- Useful Features -->
   <fieldset>
       <legend>Useful Features (Check all that apply)</legend>

       <label>
           <input type="checkbox"
               id="durability"
               name="features"
               value="Durability">
           Durability
       </label>

       <label>
           <input type="checkbox"
               id="ease"
               name="features"
               value="Ease of Use">
           Ease of Use
       </label>

       <label>
           <input type="checkbox"
               id="performance"
               name="features"
               value="Performance">
           Performance
       </label>

       <label>
           <input type="checkbox"
               id="design"
               name="features"
               value="Design">
           Design
       </label>
   </fieldset>

   <!-- Written Review -->
   <div class="form-group">
       <label for="review">Written Review (Optional)</label>

       <textarea
           id="review"
           name="review"
           rows="6"
           placeholder="Write your review here..."></textarea>
   </div>

   <!-- User Name -->
   <div class="form-group">
       <label for="username">Your Name (Optional)</label>

       <input
           type="text"
           id="username"
           name="username"
           placeholder="Enter your name">
   </div>

   <!-- Submit -->
   <div class="form-group">
       <input
           type="submit"
           value="Post Review">
   </div>

</form>

</main>

<footer>
   <p>
      &copy; <span id="currentyear"></span>
      🟢 Kehinde Marvellous Kehinde 🟢 Nigeria</p>
    <p class="highlight">
        Last Modification: <span id="lastmodified"></span></p>
</footer>  
</body>
</html>
